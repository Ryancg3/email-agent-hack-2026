# Fly.io config. `fly launch --name <your-app>` (docs/deploy-fly.md) sets `app`.
app = "my-email-agent"
primary_region = "fra"

[build]

[env]
  DJANGO_DEBUG = "0"
  DATABASE_PATH = "/data/app.db"
  PORT = "8000"

# SQLite lives here, so it survives deploys and restarts.
[mounts]
  source = "agent_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # The scheduler must keep running, so never stop the machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
